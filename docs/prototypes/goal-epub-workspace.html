<script>
(() => {
const $=id=>document.getElementById(id);
const icon=name=>'<svg aria-hidden="true"><use href="#i-'+name+'"/></svg>';
const escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const books={hugo:{title:'巴黎圣母院',author:'维克多·雨果',cover:'H',heading:'一四八二年',sub:'第一卷 · 第一章',paragraphs:['三百四十八年六个月零十九天以前，巴黎人是在全城钟声齐鸣中醒来的。这一天是一四八二年一月六日。','那天使巴黎全城居民激动的，既不是皮卡第人或勃艮第人的袭击，也不是抬着圣物的游行，更不是大学生的暴动。让这座古老城市沸腾起来的，是一个节日。','司法宫大厅里，人们早已聚集在一起。<mark>每个人都带着自己的愿望来到这里，而没有谁真正知道身边的人在等待什么。</mark>有的人想看戏，有的人想看热闹，还有的人，只想在人群里找到一个位置。','大厅的四壁渐渐退到喧闹声后面，冬日的光线穿过高窗。台上的诗人等待着片刻安静，台下的观众却各自谈论着自己的事情。','在这样的时刻，一个人的声音似乎显得微不足道。然而，正是这些彼此不同的声音，构成了这座城市的生活。']},camus:{title:'局外人',author:'阿尔贝·加缪',cover:'C',heading:'第一部',sub:'第一章',paragraphs:['今天，妈妈死了。也许是昨天，我不知道。','我收到养老院的一封电报。那些简短的字句摆在面前，既没有解释，也没有留下多少想象的余地。','<mark>生活中的一些时刻，并不会因为我们已经知道该怎样理解它们，就变得容易。</mark>我望着窗外，阳光落在街道上，人们和往常一样走过。','我需要坐车去一趟。路途并不算远，但我知道，到达之后，我必须面对一些还没有想好的事情。']}};
const goals=[
 {id:'crisis',parent:null,text:['我想理解人在压力之下如何作出选择。','先留意人物的处境，也留意我对他们的判断。'].join(String.fromCharCode(10)),area:'active'},
 {id:'choice',parent:'crisis',text:'个体的选择与环境有什么关系？',area:'active'},
 {id:'crowd',parent:'crisis',text:'人在群体中如何保持判断？',area:'active'},
 {id:'meaning',parent:null,text:'读一读那些让我感到疏离的时刻，暂时不急着寻找解释。',area:'active'},
 {id:'reading',parent:null,text:'记录值得再读的段落。',area:'active'}
];
const notes=[{id:'crowd-note',book:'hugo',kind:'note',text:'广场上的众人看着同一个舞台，却有完全不同的期待。群体中的个人，还保有自己的判断吗？',chapter:0},{id:'other-note',book:'camus',kind:'highlight',text:'生活中的一些时刻，并不会因为我们已经知道该怎样理解它们，就变得容易。',chapter:0}];
let links=[{goal:'crisis',note:'crowd-note'},{goal:'crisis',note:'other-note'}];
let selected='crisis',currentBook='hugo',surface='epub',collection='active',itemsOpen=true,page=1,fontSize=18,editing=null,toastTimer;
let editorState=null;const goalNode=$('goal-workbench');
function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2300)}
function closePopovers(){document.querySelectorAll('.popover').forEach(p=>p.hidden=true);document.querySelectorAll('[data-popup]').forEach(b=>b.setAttribute('aria-expanded','false'))}
function showScreen(name){finishEdit();closePopovers();surface=name;$('goal-screen').hidden=name!=='goal';$('epub-screen').hidden=name!=='epub';document.body.classList.toggle('view-goal',name==='goal');document.body.classList.remove('focus-mode','mobile-goal-open');(name==='goal'?$('goal-full-host'):$('goal-side-host')).appendChild(goalNode);$('expand-goal').hidden=name==='goal';if(name==='epub')collection='active';renderGoal();updateNoteLink()}
function menuFor(g){return '<div class="popover-anchor"><button class="icon-button" data-popup="menu-'+g.id+'" aria-label="Goal 操作">'+icon('more')+'</button><div class="popover menu goal-menu" id="menu-'+g.id+'" hidden>'+(g.area==='active'?'<button data-operation="complete" data-id="'+g.id+'">'+(g.complete?'重新进行':'完成 Goal')+'</button><button data-operation="archive" data-id="'+g.id+'">归档</button><button class="danger" data-operation="trash" data-id="'+g.id+'">移至最近删除</button>':'<button data-operation="restore" data-id="'+g.id+'">恢复 Goal</button>')+'</div></div>'}
function renderGoal(){if(editing)return;const g=goals.find(g=>g.id===selected&&g.area===collection),children=goals.filter(c=>c.parent===(g?.id||null)&&c.area===collection&&!c.complete);$('goal-up').disabled=!g;$('goal-root').disabled=!g&&collection==='active';$('new-goal').hidden=collection!=='active';let out='';
 if(collection!=='active')out='<div class="collection-label">'+(collection==='archive'?'归档':'最近删除')+'</div>';
 if(g){const parent=goals.find(p=>p.id===g.parent);if(parent)out+='<button class="full-parent" data-select="'+parent.id+'">↑ <span>'+escape(parent.text)+'</span></button>';out+='<div class="goal-title-row"><button class="goal-text" id="goal-title" aria-label="编辑当前 Goal">'+escape(g.text)+'</button>'+menuFor(g)+'</div>'+(g.complete?'<div class="goal-state">✓ 已完成</div>':'');}
 else if(collection==='active')out+='<div class="goal-children-label">进行中的 Goal</div>';
 out+='<div class="'+(g?'goal-child-list':'goal-root-list')+'">'+children.map(c=>'<div class="goal-child-row"><button class="goal-child" data-select="'+c.id+'">'+escape(c.text)+'</button>'+menuFor(c)+'</div>').join('')+'</div>';
 if(!g&&!children.length)out+='<p class="goal-empty">'+(collection==='active'?'从你自己的一个想法开始。':'这里暂时没有 Goal。')+'</p>';
 if(g){const material=links.filter(l=>l.goal===g.id).map(l=>notes.find(n=>n.id===l.note)).filter(Boolean);if(material.length){out+='<button class="goal-material-toggle" id="toggle-materials" aria-expanded="'+itemsOpen+'">'+icon('link')+material.length+' 条关联材料 '+icon(itemsOpen?'down':'chevron')+'</button>';if(itemsOpen)out+='<div id="goal-materials">'+material.map(n=>'<div class="goal-material">'+icon(n.kind==='note'?'list':'book')+'<div class="goal-material-content"><button class="goal-material-text" data-source="'+n.id+'">'+escape(n.text)+'</button><div class="goal-material-source">'+books[n.book].title+'</div></div><button class="unlink" data-unlink="'+n.id+'" aria-label="解除关联">×</button></div>').join('')+'</div>';}}
 $('goal-content').innerHTML=out;updateNoteLink();}
function beginEdit(mode){finishEdit();const g=goals.find(g=>g.id===selected),isNew=mode==='new';const draft=isNew?{id:'goal-'+Date.now(),parent:g?.id||null,text:'',area:'active'}:g;if(!draft)return;editing={mode,id:draft.id,draft,original:draft.text,composing:false};let input=document.createElement('textarea');input.className='goal-editor';input.setAttribute('aria-label',isNew?'新建 Goal':'编辑当前 Goal');input.rows=1;input.placeholder='写下你的想法…';input.value=draft.text;
 if(isNew){const wrap=document.createElement('div');wrap.className='goal-inline-new';wrap.append(input);const target=$('goal-content').querySelector('.goal-child-list,.goal-root-list');target.before(wrap)}else $('goal-title').replaceWith(input);
 const resize=()=>{input.style.height='0px';input.style.height=Math.max(48,input.scrollHeight)+'px'};
 input.oninput=()=>{editing.draft.text=input.value;resize()};input.oncompositionstart=()=>editing.composing=true;input.oncompositionend=()=>{editing.composing=false;editing.draft.text=input.value};input.onkeydown=e=>{e.stopPropagation();if(e.isComposing||editing.composing)return;if(e.key==='Escape'||e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();finishEdit()}};input.onblur=()=>{if(!editorState)finishEdit()};input.focus();input.setSelectionRange(input.value.length,input.value.length);resize();}
function finishEdit(){if(!editing)return;const e=editing;const input=goalNode.querySelector('textarea');if(input)e.draft.text=input.value;editing=null;if(e.mode==='new'){if(e.draft.text.trim())goals.push(e.draft)}else if(!e.draft.text.trim())e.draft.text=e.original;renderGoal();$('goal-save').classList.add('visible');setTimeout(()=>$('goal-save').classList.remove('visible'),1400)}
goalNode.addEventListener('mousedown',event=>{if(editing&&event.target.closest('button'))event.preventDefault()});
function selectGoal(id){finishEdit();selected=id;collection=goals.find(g=>g.id===id)?.area||'active';itemsOpen=true;renderGoal()}
function currentNote(){return notes.find(n=>n.book===currentBook&&n.kind==='note')||null}
function updateNoteLink(){if(!$('link-note'))return;const n=currentNote(),g=goals.find(g=>g.id===selected&&g.area==='active'&&!g.complete),linked=n&&links.some(l=>l.goal===g?.id&&l.note===n.id);$('link-note').disabled=!n||!g||linked;$('link-note').innerHTML=icon(linked?'check':'link')+(linked?'已加入当前 Goal':g?'加入当前 Goal':'先选择一个 Goal');}
function renderBook(){const b=books[currentBook];$('reader-book-title').textContent=b.title;$('book-text').innerHTML='<h2>'+b.heading+'</h2><div class="chapter-subtitle">'+b.sub+'</div>'+b.paragraphs.map(p=>'<p>'+p+'</p>').join('');$('chapter-menu').querySelectorAll('[data-chapter]').forEach((el,i)=>el.textContent=currentBook==='hugo'?['第一卷 · 一四八二年','第二卷 · 格雷沃广场','第三卷 · 巴黎圣母院'][i]:['第一部 · 第一章','第一部 · 第二章','第二部 · 第一章'][i]);const n=currentNote();$('note-copy').textContent=n?.text||'点击这里写下阅读笔记。';updateNoteLink();setPage(1)}
function openBook(id){finishEdit();currentBook=id;renderBook();showScreen('epub')}
function setPage(value){page=Math.max(1,Math.min(24,value));$('page-count').textContent=page+' / 24';$('reading-progress').textContent=Math.round(page/24*100)+'%';$('previous-page').disabled=page===1;$('next-page').disabled=page===24}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(innerWidth<=650&&document.body.classList.contains('mobile-goal-open')&&event.target.closest('main')&&b?.id!=='toggle-goal')document.body.classList.remove('mobile-goal-open');if(!event.target.closest('.popover,.popover-anchor,[data-popup]'))closePopovers();if(!b)return;
 if(b.dataset.popup){const p=$(b.dataset.popup),opening=p.hidden;closePopovers();p.hidden=!opening;b.setAttribute('aria-expanded',String(opening));if(p.id==='global-menu'){const r=b.getBoundingClientRect();p.style.left=Math.min(r.left,innerWidth-214)+'px';p.style.top=(r.top>innerHeight/2?Math.max(8,r.top-p.offsetHeight-8):r.bottom+8)+'px';p.style.bottom='auto';}return}
 if(b.dataset.select)selectGoal(b.dataset.select);
 if(b.id==='goal-title')beginEdit('edit');
 if(b.id==='toggle-materials'){itemsOpen=!itemsOpen;renderGoal()}
 if(b.dataset.unlink){links=links.filter(l=>!(l.goal===selected&&l.note===b.dataset.unlink));renderGoal()}
 if(b.dataset.source){const n=notes.find(n=>n.id===b.dataset.source);openBook(n.book);const mark=$('book-text').querySelector('mark');if(mark){mark.classList.add('source-located');mark.scrollIntoView({block:'center',behavior:'smooth'});}}
 if(b.dataset.book)openBook(b.dataset.book);
 if(b.dataset.collection){finishEdit();collection=b.dataset.collection;selected=null;showScreen('goal')}
 if(b.dataset.operation){finishEdit();const g=goals.find(g=>g.id===b.dataset.id);if(b.dataset.operation==='complete')g.complete=!g.complete;else {const area=b.dataset.operation==='restore'?'active':b.dataset.operation;const branch=new Set([g.id]);for(let i=0;i<goals.length;i++)for(const n of goals)if(branch.has(n.parent))branch.add(n.id);goals.forEach(n=>{if(branch.has(n.id))n.area=area});selected=null;}closePopovers();renderGoal()}
 if(b.dataset.paper){const colors={white:['#fff','#323238'],cream:['#f6f0e4','#554d42'],night:['#25262c','#dedee5']};$('epub-screen').style.setProperty('--paper',colors[b.dataset.paper][0]);$('epub-screen').style.setProperty('--ink',colors[b.dataset.paper][1]);document.querySelectorAll('[data-paper]').forEach(p=>p.setAttribute('aria-pressed',String(p===b)))}
 if(b.dataset.chapter){$('book-text').querySelector('h2').textContent=b.textContent.split('·').pop().trim();$('book-text').querySelector('.chapter-subtitle').textContent=b.textContent;setPage(1+Number(b.dataset.chapter)*8);closePopovers();$('reading-stage').scrollTop=0}
 if(b.dataset.export){const text=b.dataset.export==='notes'?'# '+books[currentBook].title+' · 笔记\n\n'+(currentNote()?.text||''):$('book-text').innerText;download(text,books[currentBook].title+'.md');closePopovers()}
 if(b.dataset.action){closePopovers();if(b.dataset.action==='backup')download(JSON.stringify({goals,notes,links},null,2),'aurareader-prototype-backup.json');else toast(b.dataset.action==='restore'?'设计稿：这里打开资料库恢复窗口':books[currentBook].title+' · '+books[currentBook].author+' · EPUB')}
});
function download(text,name){const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePopovers();document.body.classList.remove('focus-mode','mobile-goal-open')}});
$('new-goal').onclick=()=>beginEdit('new');$('goal-root').onclick=()=>{finishEdit();selected=null;collection='active';renderGoal()};$('goal-up').onclick=()=>{const g=goals.find(g=>g.id===selected);selectGoal(g?.parent||null)};
$('expand-goal').onclick=()=>showScreen('goal');$('return-reading').onclick=()=>showScreen('epub');
$('toggle-goal').onclick=()=>{finishEdit();const closed=innerWidth<=650?!document.body.classList.toggle('mobile-goal-open'):document.body.classList.toggle('goal-hidden');$('toggle-goal').setAttribute('aria-expanded',String(!closed));$('toggle-goal').setAttribute('aria-label',closed?'展开 Goal 侧栏':'收起 Goal 侧栏')};
$('font-minus').onclick=()=>resizeFont(-1);$('font-plus').onclick=()=>resizeFont(1);function resizeFont(delta){fontSize=Math.min(26,Math.max(14,fontSize+delta));$('font-size').textContent=fontSize+' px';$('book-text').style.fontSize=fontSize+'px'}
$('font-family').onchange=e=>$('book-text').style.fontFamily=e.target.value==='serif'?'Georgia,"Songti SC",SimSun,serif':'Inter,"Microsoft YaHei",sans-serif';$('line-height').oninput=e=>$('book-text').style.lineHeight=e.target.value;$('reading-width').oninput=e=>$('reading-content').style.maxWidth=e.target.value+'px';
$('app-theme').onclick=()=>{const dark=document.body.classList.toggle('dark');$('app-theme').querySelector('span').textContent=dark?'深色':'浅色';closePopovers()};
$('previous-page').onclick=()=>setPage(page-1);$('next-page').onclick=()=>setPage(page+1);
$('link-note').onclick=()=>{finishEdit();const n=currentNote();if(!n||!selected)return;if(!links.some(l=>l.goal===selected&&l.note===n.id))links.push({goal:selected,note:n.id});itemsOpen=true;renderGoal()};
$('note-copy').onclick=()=>{const current=currentNote();const input=document.createElement('textarea');input.className='note-editor';input.setAttribute('aria-label','阅读笔记');input.value=current?.text||'';$('note-copy').hidden=true;$('note-copy').after(input);input.focus();input.onblur=()=>{if(input.value.trim()){if(current)current.text=input.value;else notes.push({id:'note-'+Date.now(),book:currentBook,kind:'note',text:input.value,chapter:0});}$('note-copy').textContent=currentNote()?.text||'点击这里写下阅读笔记。';input.remove();$('note-copy').hidden=false;renderGoal()};input.onkeydown=e=>{if(!e.isComposing&&(e.key==='Escape'||e.key==='Enter'&&(e.ctrlKey||e.metaKey))){e.preventDefault();input.blur()}}};
const resizer=$('goal-resizer');let drag=null;const size=width=>{width=Math.round(Math.max(240,Math.min(520,innerWidth-660,width)));document.documentElement.style.setProperty('--goal-width',width+'px');resizer.setAttribute('aria-valuenow',width)};
resizer.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();drag={x:e.clientX,width:document.querySelector('.sidebar').getBoundingClientRect().width};resizer.setPointerCapture(e.pointerId);editorState=true};resizer.onpointermove=e=>{if(drag)size(drag.width+e.clientX-drag.x)};resizer.onpointerup=()=>{drag=null;editorState=null};resizer.onpointercancel=()=>{if(drag)size(drag.width);drag=null;editorState=null};resizer.ondblclick=()=>size(320);resizer.onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();size(document.querySelector('.sidebar').getBoundingClientRect().width+(e.key==='ArrowRight'?10:-10))}};
$('goal-side-host').appendChild(goalNode);renderGoal();renderBook();
})();
</script>
</body>
</html>
