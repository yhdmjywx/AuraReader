<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuraReader · 沉浸式页边笔记演示</title>
<style>
  * { box-sizing: border-box; }
  :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; color: #243246; background: #edf0f4; }
  body { margin: 0; }
  button, select, textarea { font: inherit; }
  button { cursor: pointer; }
  button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #3980ff; outline-offset: 4px; }
  button:disabled { cursor: default; opacity: .35; }
  .review { min-height: 72px; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; background: #f8f9fb; border-bottom: 1px solid #dde2e9; }
  .review-title { display: flex; align-items: baseline; gap: 12px; }
  .review-title strong { font-size: 15px; font-weight: 600; }
  .review-title span { color: #778394; font-size: 12px; }
  .review-controls { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .switch { display: flex; padding: 3px; border: 1px solid #dde2e9; border-radius: 8px; gap: 2px; }
  .switch button { border: 0; background: transparent; color: #647286; border-radius: 5px; padding: 6px 14px; }
  .switch button[aria-pressed="true"] { background: #fff; color: #235dba; box-shadow: 0 1px 4px #25324816; }
  .review-controls label { display: flex; align-items: center; gap: 8px; color: #647286; }
  select { padding: 6px 10px; border: 1px solid #d8dee8; border-radius: 6px; color: #344358; background: #fff; }
  .geometry { padding: 10px 24px; color: #6a7687; font-size: 12px; display: flex; gap: 18px; justify-content: space-between; min-height: 38px; }
  #stage-shell { margin: 0 16px 20px; position: relative; overflow: hidden; border-radius: 6px; box-shadow: 0 4px 30px #1f2d3d0b; background: #fff; }
  #stage { position: absolute; left: 0; top: 0; width: 1613px; height: 928px; transform-origin: top left; background: #fff; color: #263447; }
  .app-header { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #edf0f4; position: relative; }
  .brand { display: flex; gap: 10px; align-items: center; font-weight: 650; font-size: 17px; }
  .brand-mark { width: 20px; height: 19px; position: relative; display: inline-block; }
  .brand-mark::before, .brand-mark::after { content: ''; position: absolute; width: 9px; height: 18px; background: #3c83fc; top: 0; border-radius: 1px; }
  .brand-mark::before { left: 0; transform: skewY(5deg); }
  .brand-mark::after { right: 0; transform: skewY(-5deg); }
  .book-name { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; padding: 8px 15px; background: #f3f5f7; border-radius: 30px; font-size: 13px; color: #536278; }
  svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .header-icons { display: flex; gap: 22px; color: #62748b; }
  .header-icons span { display: flex; }
  .reader { position: absolute; top: 52px; bottom: 44px; left: 0; right: 0; }
  .paper { position: absolute; top: 48px; bottom: 40px; width: 560px; overflow: hidden; font: 18px/1.85 Georgia, "Times New Roman", serif; text-align: justify; }
  .paper p { margin: 0 0 18px; text-indent: 2em; }
  .paper em { font-style: italic; }
  .paper mark { background: #fff1a6; color: inherit; padding: 1px 0; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .source { color: inherit; background: none; border: none; border-radius: 0; padding: 0; text-decoration: underline; text-decoration-color: #e56b6b; text-decoration-thickness: 1.5px; text-underline-offset: 4px; cursor: pointer; }
  .source:focus-visible { outline-offset: 3px; }
  .source sup { color: #4481cc; font: 11px/1 system-ui, sans-serif; margin-left: 3px; vertical-align: super; text-decoration: none; }
  .source.is-active { background: #e9f1fd; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .notes-lane { position: absolute; top: 48px; bottom: 40px; width: 260px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #dde3eb transparent; }
  .notes-lane:empty { display: none; }
  .note { position: absolute; width: 100%; padding: 0 6px; color: #45566c; font-size: 14px; line-height: 1.8; overflow-wrap: anywhere; transition: color .15s; }
  .note-top { display: flex; gap: 8px; align-items: baseline; }
  .note-no { color: #88a0bd; font-size: 11px; flex: none; }
  .note-quote { color: #8390a0; font-family: Georgia, "Times New Roman", serif; font-size: 13px; font-style: italic; margin: 0; }
  .note-text { margin: 0 0 7px; white-space: pre-wrap; }
  .note.is-active { color: #245b9f; }
  .note.is-active .note-no { color: #245b9f; }
  .note-actions { display: flex; justify-content: flex-end; gap: 10px; }
  .note-actions button { padding: 5px; display: flex; border: 0; background: transparent; color: #a2adba; }
  .note-actions button:hover { color: #346fbd; }
  .note-actions svg { width: 14px; height: 14px; }
  .app-footer { position: absolute; bottom: 0; height: 44px; left: 0; right: 0; display: flex; align-items: center; gap: 24px; justify-content: center; color: #7a8b9f; font-size: 12px; }
  .app-footer button { background: transparent; border: 0; color: #667d98; display: flex; padding: 7px; }
  .app-footer svg { width: 16px; height: 16px; }
  #stage.bottom-notes .reader { bottom: 216px; }
  #stage.bottom-notes .paper { bottom: 24px; }
  #stage.bottom-notes .notes-lane { top: auto; bottom: -168px; height: 144px; display: flex; gap: 36px; overflow-x: auto; overflow-y: hidden; align-items: flex-start; }
  #stage.bottom-notes .notes-lane:empty { display: none; }
  #stage.bottom-notes .note { position: relative; top: 0 !important; width: 350px; flex: 0 0 350px; }
  #stage.bottom-notes .note-quote { max-height: 47px; overflow: hidden; }
  #stage.bottom-notes .note-text { margin-top: 6px; }
  #stage.bottom-notes .note-actions { position: absolute; right: 0; bottom: -4px; }
  .afterword { margin: 0 24px 20px; color: #778394; font-size: 12px; }
  dialog { border: 1px solid #e3e8ef; border-radius: 12px; padding: 24px; width: 400px; color: #344358; box-shadow: 0 16px 64px #172b4d20; }
  dialog::backdrop { background: #14243a25; }
  dialog h2 { margin: 0 0 16px; font-size: 17px; }
  dialog textarea { width: 100%; min-height: 120px; resize: vertical; padding: 12px; border: 1px solid #d6dfe9; border-radius: 6px; line-height: 1.7; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  .dialog-actions button { border: 1px solid #d6dfe9; border-radius: 6px; background: #fff; color: #536278; padding: 7px 16px; }
  .dialog-actions button:last-child { background: #397cf5; border-color: #397cf5; color: #fff; }
  @media (max-width: 720px) { .review { padding: 12px 16px; } .review-title span { display: none; } .geometry { padding: 10px 16px; flex-wrap: wrap; gap: 6px; } .review-controls { gap: 10px; } }
</style>
</head>
<body>
<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><defs>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="m14 5 5 5M4 20l5-1L20 8a2 2 0 0 0-5-5L4 14l-1 6Z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M3 6h1m-1 6h1m-1 6h1"/></symbol>
  <symbol id="i-shelf" viewBox="0 0 24 24"><path d="M3 4h5v16H3zm5 3h5v13H8zm7-4 4-1 4 17-4 1zM3 15h10"/></symbol>
  <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18h2a2 2 0 0 0 0-4h-1a1.5 1.5 0 0 1 0-3h3a5 5 0 0 0 5-5c0-4-5-6-9-6Z"/><circle cx="7" cy="10" r=".7"/><circle cx="11" cy="7" r=".7"/><circle cx="16" cy="8" r=".7"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v13m-6-6 6 6 6-6M4 20h16"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m8 0h5v-5"/></symbol>
</defs></svg>
<div class="review">
  <div class="review-title"><strong>沉浸式页边笔记</strong><span>交互演示 · 尚未接入产品</span></div>
  <div class="review-controls">
    <div class="switch" aria-label="演示版式"><button type="button" data-mode="single" aria-pressed="false">单页</button><button type="button" data-mode="double" aria-pressed="true">双页</button></div>
    <label>演示窗口<select id="size"><option value="1613">1613 × 928</option><option value="1920">1920 × 1080</option><option value="1440">1440 × 900</option><option value="1366">1366 × 900</option></select></label>
  </div>
</div>
<div class="geometry" aria-live="polite"><span id="layout-info"></span><span id="zoom-info"></span></div>
<div id="stage-shell">
  <div id="stage">
    <header class="app-header">
      <div class="brand"><span class="brand-mark"></span>AuraReader</div>
      <div class="book-name"><svg aria-hidden="true"><use href="#i-list"/></svg>pg11-images-3 <span>⌄</span></div>
      <div class="header-icons" aria-hidden="true"><span><svg><use href="#i-shelf"/></svg></span><span><svg><use href="#i-palette"/></svg></span><span><svg><use href="#i-download"/></svg></span><span><svg><use href="#i-expand"/></svg></span></div>
    </header>
    <main class="reader" aria-label="阅读正文与当前屏幕笔记">
      <article class="paper" id="paper-left" aria-label="正文左页"></article>
      <article class="paper" id="paper-right" aria-label="正文右页"></article>
      <aside class="notes-lane" id="notes-left" aria-label="左页关联笔记"></aside>
      <aside class="notes-lane" id="notes-right" aria-label="当前屏幕关联笔记"></aside>
    </main>
    <nav class="app-footer" aria-label="演示翻页"><button id="prev" type="button" aria-label="上一页"><svg style="transform:rotate(180deg)"><use href="#i-chevron"/></svg></button><span id="page-label">3–4 / 9 栏</span><button id="next" type="button" aria-label="下一页"><svg><use href="#i-chevron"/></svg></button></nav>
  </div>
</div>
<p class="afterword">可点击原文下划线与页边笔记查看关联；底部箭头切换示例内容。顶部版式和窗口控件仅用于审稿。</p>
<dialog id="editor"><form method="dialog"><h2>编辑笔记</h2><textarea id="note-input" aria-label="笔记正文"></textarea><div class="dialog-actions"><button value="cancel">取消</button><button id="save-edit" value="save">保存</button></div></form></dialog>
<script>
(() => {
  const el = id => document.getElementById(id);
  const stage = el('stage'), shell = el('stage-shell');
  const state = { mode: 'double', width: 1613, height: 928, screen: 0, active: null };
  const notes = {
    distance: { number: '1', quote: '“I wonder how many miles I’ve fallen by this time?”', text: '她用课堂上学过的知识，理解眼前不可思议的下坠。好奇心让恐惧暂时退到了后面。', side: 'left' },
    dinah: { number: '2', quote: '“Do cats eat bats? Do cats eat bats?”', text: '同一句话重复着，像是在用自言自语安抚自己。她需要的也许不是答案，而是陪伴。', side: 'right' },
    doors: { number: '3', quote: '“there was a little door about fifteen inches high”', text: '门和钥匙都找到了，真正的阻碍却变成了自己的尺寸。', side: 'right' }
  };
  const pages = [
    `<p>How brave they’ll all think me at home! Why, I wouldn’t say anything about it, even if I fell off the top of the house!”</p>
     <p>Down, down, down. Would the fall <em>never</em> come to an end? <a class="source" data-note="distance" href="#note-distance">“I wonder how many miles I’ve fallen by this time?”<sup>1</sup></a> she said aloud. “I must be getting somewhere near the centre of the earth. Let me see: that would be four thousand miles down, I think—” (for, you see, Alice had learnt several things of this sort in her lessons in the schoolroom, and though this was not a <em>very</em> good opportunity for showing off her knowledge, as there was no one to listen to her, still it was good practice to say it over) “—yes, that’s about the right distance—but then I wonder what Latitude or Longitude I’ve got to?” (Alice had no idea what Latitude was, or Longitude either, but thought they were nice grand words to say.)</p>
     <p>Presently she began again. “I wonder if I shall fall right <em>through</em> the earth!”</p>`,
    `<p>“And what an ignorant little girl she’ll think me for asking! No, it’ll never do to ask: perhaps I shall see it written up somewhere.”</p>
     <p><mark>Down, down, down. There was nothing else to do, so Alice soon began talking again.</mark> “Dinah’ll miss me very much to-night, I should think!” (Dinah was the cat.) “I hope they’ll remember her saucer of milk at tea-time. Dinah my dear! I wish you were down here with me! There are no mice in the air, I’m afraid, but you might catch a bat, and that’s very like a mouse, you know. But <a class="source" data-note="dinah" href="#note-dinah">do cats eat bats, I wonder?” And here Alice began to get rather sleepy, and went on saying to herself, in a dreamy sort of way, “Do cats eat bats? Do cats eat bats?” and sometimes, “Do bats eat cats?”<sup>2</sup></a> for, you see, as she couldn’t answer either question, it didn’t much matter which way she put it. She felt that she was dozing off, and had just begun to dream that she was walking hand in hand with Dinah.</p>`,
    `<p>Alice was not a bit hurt, and she jumped up on to her feet in a moment: she looked up, but it was all dark overhead; before her was another long passage, and the White Rabbit was still in sight, hurrying down it.</p>
     <p>There were doors all round the hall, but they were all locked; and when Alice had been all the way down one side and up the other, trying every door, she walked sadly down the middle, wondering how she was ever to get out again.</p>
     <p>Suddenly she came upon a little three-legged table, all made of solid glass; there was nothing on it except a tiny golden key, and Alice’s first thought was that it might belong to one of the doors of the hall; but, alas! either the locks were too large, or the key was too small, but at any rate it would not open any of them.</p>`,
    `<p>However, on the second time round, she came upon a low curtain she had not noticed before, and behind it was <a class="source" data-note="doors" href="#note-doors">a little door about fifteen inches high:<sup>3</sup></a> she tried the little golden key in the lock, and to her great delight it fitted!</p>
     <p>Alice opened the door and found that it led into a small passage, not much larger than a rat-hole: she knelt down and looked along the passage into the loveliest garden you ever saw.</p>
     <p>How she longed to get out of that dark hall, and wander about among those beds of bright flowers and those cool fountains, but she could not even get her head through the doorway; “and even if my head would go through,” thought poor Alice, “it would be of very little use without my shoulders.”</p>`
  ];
  let placement = '';
  function noteNode(id) {
    const data = notes[id], note = document.createElement('section');
    note.className = 'note'; note.id = `note-${id}`; note.dataset.note = id;
    note.innerHTML = `<p class="note-text"></p><div class="note-actions"><button type="button" data-edit="${id}" aria-label="编辑笔记 ${data.number}"><svg aria-hidden="true"><use href="#i-edit"/></svg></button><button type="button" data-delete="${id}" aria-label="删除笔记 ${data.number}"><svg aria-hidden="true"><use href="#i-trash"/></svg></button></div>`;
    note.querySelector('.note-text').textContent = data.text;
    note.addEventListener('click', event => { if (!event.target.closest('button')) activate(id); });
    return note;
  }
  function activate(id) {
    state.active = id;
    stage.querySelectorAll('[data-note]').forEach(node => node.classList.toggle('is-active', node.dataset.note === id));
  }
  function geometry() {
    const w = state.width, isDouble = state.mode === 'double';
    stage.style.width = `${w}px`; stage.style.height = `${state.height}px`;
    let textLeft, noteWidth, noteLeft, gap = 24;
    const spreadWidth = isDouble ? 1192 : 560;
    if (isDouble && w >= 1612) {
      placement = 'flanks'; noteWidth = Math.min(260, (w - 1192 - 68) / 2);
      textLeft = (w - 1192) / 2; noteLeft = textLeft + 1192 + gap;
    } else if (isDouble && w >= 1424) {
      placement = 'right'; noteWidth = Math.min(220, w - 1248);
      textLeft = (w - 1192 - gap - noteWidth) / 2; noteLeft = textLeft + 1192 + gap;
    } else if (isDouble) {
      placement = 'bottom'; noteWidth = 1192; textLeft = (w - 1192) / 2; noteLeft = textLeft;
    } else {
      placement = 'right'; noteWidth = 260; gap = 48; textLeft = (w - 560) / 2; noteLeft = textLeft + 560 + gap;
      if (noteLeft + noteWidth > w - 24) { noteWidth = 220; textLeft = (w - 560 - 32 - noteWidth) / 2; noteLeft = textLeft + 592; gap = 32; }
    }
    stage.classList.toggle('bottom-notes', placement === 'bottom');
    el('paper-left').style.left = `${textLeft}px`;
    el('paper-right').style.left = `${textLeft + 632}px`;
    el('paper-right').hidden = !isDouble;
    el('notes-left').style.left = `${textLeft - gap - noteWidth}px`;
    el('notes-left').style.width = `${noteWidth}px`;
    el('notes-right').style.left = `${noteLeft}px`;
    el('notes-right').style.width = `${noteWidth}px`;
    el('layout-info').textContent = isDouble
      ? `正文 560 × 2px · 栏间距 72px · ${placement === 'flanks' ? `双侧笔记各 ${Math.round(noteWidth)}px` : placement === 'bottom' ? '笔记自动移到底部，正文行宽不变' : `笔记集中右侧 ${Math.round(noteWidth)}px`}`
      : `正文 560px · 右侧笔记 ${noteWidth}px · 与正文间隔 ${gap}px`;
    return spreadWidth;
  }
  function renderNotes() {
    el('notes-left').replaceChildren(); el('notes-right').replaceChildren();
    const renderedIds = new Set();
    stage.querySelectorAll('.paper:not([hidden]) .source').forEach(source => {
      const id = source.dataset.note;
      if (!notes[id] || notes[id].deleted || renderedIds.has(id)) return;
      renderedIds.add(id);
      const isLeft = source.closest('.paper').id === 'paper-left';
      const lane = el(placement === 'flanks' && isLeft ? 'notes-left' : 'notes-right');
      lane.appendChild(noteNode(id));
    });
    for (const lane of [el('notes-left'), el('notes-right')]) {
      let previousBottom = 0;
      for (const note of lane.children) {
        const source = stage.querySelector(`.source[data-note="${note.dataset.note}"]`);
        const localY = source.offsetTop;
        const top = Math.max(previousBottom, Math.min(lane.clientHeight - note.offsetHeight, localY));
        note.style.top = `${Math.max(0, top)}px`;
        previousBottom = Math.max(0, top) + note.offsetHeight + 26;
      }
    }
    activate(state.active);
  }
  function fit() {
    const scale = Math.min(1, shell.clientWidth / state.width);
    stage.style.transform = `scale(${scale})`;
    shell.style.height = `${state.height * scale}px`;
    el('zoom-info').textContent = `${state.width} × ${state.height} 画布 · 预览 ${Math.round(scale * 100)}%`;
  }
  function render() {
    const index = state.mode === 'double' ? state.screen * 2 : state.screen;
    el('paper-left').innerHTML = pages[index];
    el('paper-right').innerHTML = state.mode === 'double' ? pages[index + 1] : '';
    stage.querySelectorAll('.source').forEach(source => {
      if (notes[source.dataset.note]?.deleted) { source.querySelector('sup')?.remove(); source.classList.remove('source'); source.removeAttribute('href'); }
    });
    geometry(); renderNotes(); fit();
    el('page-label').textContent = state.mode === 'double' ? `${index + 3}–${index + 4} / 9 栏` : `${index + 3} / 9 栏`;
    el('prev').disabled = state.screen === 0;
    el('next').disabled = state.screen >= (state.mode === 'double' ? 1 : 3);
    document.querySelectorAll('[data-mode]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mode === state.mode)));
  }
  document.querySelectorAll('[data-mode]').forEach(button => button.addEventListener('click', () => { state.mode = button.dataset.mode; state.screen = 0; render(); }));
  el('size').addEventListener('change', event => { state.width = Number(event.target.value); state.height = state.width === 1920 ? 1080 : state.width === 1613 ? 928 : 900; render(); });
  el('prev').addEventListener('click', () => { state.screen--; state.active = null; render(); });
  el('next').addEventListener('click', () => { state.screen++; state.active = null; render(); });
  stage.addEventListener('click', event => {
    const source = event.target.closest('.source');
    if (source) { event.preventDefault(); activate(source.dataset.note); }
    const edit = event.target.closest('[data-edit]');
    if (edit) { el('editor').dataset.note = edit.dataset.edit; el('note-input').value = notes[edit.dataset.edit].text; el('editor').showModal(); }
    const remove = event.target.closest('[data-delete]');
    if (remove) { notes[remove.dataset.delete].deleted = true; stage.querySelectorAll(`.source[data-note="${remove.dataset.delete}"]`).forEach(node => { node.querySelector('sup')?.remove(); node.classList.remove('source', 'is-active'); node.removeAttribute('href'); }); renderNotes(); }
  });
  el('editor').addEventListener('close', () => { if (el('editor').returnValue === 'save') { notes[el('editor').dataset.note].text = el('note-input').value.trim(); renderNotes(); } });
  new ResizeObserver(fit).observe(shell);
  render();
})();
</script>
</body>
</html>
