 {id:'reading',text:'什么是有效的阅读？',children:[],book:'hugo',notes:1,area:'active'}
];
const books={hugo:{title:'巴黎圣母院',author:'维克多·雨果',cover:'H',heading:'一四八二年',sub:'第一卷 · 第一章',paragraphs:['三百四十八年六个月零十九天以前，巴黎人是在全城钟声齐鸣中醒来的。这一天是一四八二年一月六日。','那天使巴黎全城居民激动的，既不是皮卡第人或勃艮第人的袭击，也不是抬着圣物的游行，更不是大学生的暴动。让这座古老城市沸腾起来的，是一个节日。','司法宫大厅里，人们早已聚集在一起。<mark>每个人都带着自己的愿望来到这里，而没有谁真正知道身边的人在等待什么。</mark>有的人想看戏，有的人想看热闹，还有的人，只想在人群里找到一个位置。','大厅的四壁渐渐退到喧闹声后面，冬日的光线穿过高窗。台上的诗人等待着片刻安静，台下的观众却各自谈论着自己的事情。','在这样的时刻，一个人的声音似乎显得微不足道。然而，正是这些彼此不同的声音，构成了这座城市的生活。']},camus:{title:'局外人',author:'阿尔贝·加缪',cover:'C',heading:'第一部',sub:'第一章',paragraphs:['今天，妈妈死了。也许是昨天，我不知道。','我收到养老院的一封电报。那些简短的字句摆在面前，既没有解释，也没有留下多少想象的余地。','<mark>生活中的一些时刻，并不会因为我们已经知道该怎样理解它们，就变得容易。</mark>我望着窗外，阳光落在街道上，人们和往常一样走过。','我需要坐车去一趟。路途并不算远，但我知道，到达之后，我必须面对一些还没有想好的事情。']}};
let selected='crisis',currentBook='hugo',page=1,fontSize=18,collection='active',toastTimer;
function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2400)}
function closePopovers(){document.querySelectorAll('.popover').forEach(p=>p.hidden=true);document.querySelectorAll('[data-popup]').forEach(b=>b.setAttribute('aria-expanded','false'));$('global-host').classList.remove('mobile-open')}
function showScreen(name){closePopovers();$('goal-screen').hidden=name!=='goal';$('epub-screen').hidden=name!=='epub';document.querySelectorAll('[data-screen]').forEach(b=>{b.classList.toggle('active',b.dataset.screen===name);if(b.dataset.screen===name)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(name==='goal')document.body.classList.remove('focus-mode')}
function renderGoals(){
 const current=goals.find(g=>g.id===selected)||goals[0];
 const visible=goals.filter(g=>g.area===collection);
 $('sidebar-goals').innerHTML=goals.filter(g=>g.area==='active').map(g=>`<button class="side-item ${g.id===selected?'is-current':''}" data-goal="${g.id}">${icon('goal')}<span>${escape(g.text)}</span></button>`).join('');
 const title={active:'Goals',archive:'归档',trash:'最近删除'}[collection];
 $('goal-header-title').textContent=title;$('goal-page-title').textContent=collection==='active'?'正在探索的问题':title;$('goal-eyebrow').textContent=collection==='active'?'我的阅读方向':'Goals';$('goal-description').textContent=collection==='active'?'把不同书里的线索，放回同一个问题。':collection==='archive'?'已归档的阅读方向。':'已删除的 Goal 可以恢复。';$('collection-back').hidden=collection==='active';$('new-goal').hidden=collection!=='active';
 $('goal-list').innerHTML=visible.length?`<div class="list-heading">${collection==='active'?'进行中':title}<span class="goal-count">${visible.length}</span></div>`+visible.map(g=>`<button class="goal-row ${g.id===selected?'selected':''}" data-goal="${g.id}"><span class="status-ring"></span><span class="goal-name">${escape(g.text)}</span><span class="goal-meta">${g.notes} 条材料</span>${icon('chevron')}</button>${g.id===selected&&collection==='active'?g.children.map(c=>`<button class="goal-row sub-row" data-child="${escape(c)}"><span class="status-ring"></span><span class="goal-name">${escape(c)}</span></button>`).join(''):''}`).join('')+(collection==='active'?`<button class="new-row" data-new>${icon('plus')}新建 Goal</button>`:''):`<div class="empty-collection">${collection==='active'?'新建一个 Goal，开始探索。':'这里暂时没有 Goal'}</div>`;
 const detailGoal=visible.find(g=>g.id===selected)||visible[0];$('goal-detail').hidden=!detailGoal;
 if(detailGoal){const g=detailGoal,b=books[g.book];$('goal-detail').innerHTML=`<div class="detail-top"><span>Goal 详情</span><div class="popover-anchor"><button class="icon-button" data-popup="goal-menu" aria-label="Goal 操作">${icon('more')}</button><div class="popover menu" id="goal-menu" hidden>${g.area==='active'?'<button data-goal-action="archive">归档 Goal</button><button class="danger" data-goal-action="trash">删除 Goal</button>':'<button data-goal-action="active">恢复 Goal</button>'}</div></div></div><h3>${escape(g.text)}</h3><div class="property"><span>状态</span><span class="status-ring"></span>${g.area==='active'?'进行中':g.area==='archive'?'已归档':'最近删除'}</div><div class="property"><span>上级</span><span>—</span></div><div class="section-title">关联书籍<span>1</span></div><button class="book-link" data-book="${g.book}"><span class="mini-cover">${b.cover}</span><span><strong>${b.title}</strong><small>${b.author} · EPUB</small></span>${icon('chevron')}</button><div class="section-title">关联材料<span>${g.notes}</span></div><button class="material" data-book="${g.book}">“每个人都带着自己的愿望来到这里。”<small>${b.title} · 第一章 ${icon('chevron')}</small></button><p class="detail-note">群体会放大个人的选择，还是让选择消失？</p>`;if(!visible.some(g=>g.id===selected))selected=g.id}
 $('reader-goal').textContent=current.text;
}
function renderBook(){const b=books[currentBook];$('reader-book-title').textContent=b.title;$('book-text').innerHTML=`<h2>${b.heading}</h2><div class="chapter-subtitle">${b.sub}</div>${b.paragraphs.map(p=>`<p>${p}</p>`).join('')}`;document.querySelectorAll('[data-book]').forEach(el=>el.classList.toggle('is-current',el.dataset.book===currentBook));$('chapter-menu').querySelectorAll('[data-chapter]').forEach((el,i)=>el.textContent=currentBook==='hugo'?['第一卷 · 一四八二年','第二卷 · 格雷沃广场','第三卷 · 巴黎圣母院'][i]:['第一部 · 第一章','第一部 · 第二章','第二部 · 第一章'][i]);setPage(1)}
function openBook(id){currentBook=id;renderBook();showScreen('epub')}
function setPage(value){page=Math.max(1,Math.min(24,value));$('page-count').textContent=`${page} / 24`;$('reading-progress').textContent=`${Math.round(page/24*100)}%`;$('previous-page').disabled=page===1;$('next-page').disabled=page===24}
function newGoal(){$('goal-input').value='';$('goal-dialog').showModal()}
document.addEventListener('click',event=>{
 const b=event.target.closest('button');
 if(!event.target.closest('.popover,.popover-anchor,[data-popup]'))closePopovers();
 if(!b)return;
 if(b.dataset.popup){const panel=$(b.dataset.popup),opening=panel.hidden;closePopovers();panel.hidden=!opening;b.setAttribute('aria-expanded',String(opening));if(b.dataset.popup==='global-menu'&&innerWidth<=650)$('global-host').classList.toggle('mobile-open',opening);return}
 if(b.dataset.screen){if(b.dataset.screen==='goal'){collection='active';renderGoals()}showScreen(b.dataset.screen)}
 if(b.dataset.goal){selected=b.dataset.goal;collection='active';renderGoals();showScreen('goal')}
 if(b.dataset.book)openBook(b.dataset.book);
 if(b.hasAttribute('data-new'))newGoal();
 if(b.dataset.child){$('goal-detail').querySelector('h3').textContent=b.dataset.child;$('goal-detail').querySelectorAll('.property')[1].innerHTML=`<span>上级</span><span>${escape(goals.find(g=>g.id===selected).text)}</span>`}
 if(b.dataset.collection){collection=b.dataset.collection;renderGoals();showScreen('goal')}
 if(b.dataset.goalAction){const g=goals.find(g=>g.id===selected);g.area=b.dataset.goalAction;closePopovers();renderGoals();toast(g.area==='active'?'Goal 已恢复':g.area==='archive'?'Goal 已归档':'Goal 已移至最近删除')}
 if(b.dataset.paper){const colors={white:['#fff','#323238'],cream:['#f6f0e4','#554d42'],night:['#25262c','#dedee5']};$('epub-screen').style.setProperty('--paper',colors[b.dataset.paper][0]);$('epub-screen').style.setProperty('--ink',colors[b.dataset.paper][1]);document.querySelectorAll('[data-paper]').forEach(p=>p.setAttribute('aria-pressed',String(p===b)))}
 if(b.dataset.chapter){$('book-text').querySelector('h2').textContent=b.textContent.split('·').pop().trim();$('book-text').querySelector('.chapter-subtitle').textContent=b.textContent;setPage(1+Number(b.dataset.chapter)*8);$('chapter-menu').querySelectorAll('button').forEach(p=>p.classList.toggle('active',p===b));closePopovers();$('reading-stage').scrollTop=0}
 if(b.dataset.export){const text=b.dataset.export==='notes'?`# ${books[currentBook].title} · 笔记\n\n群体中的个人，还保有自己的判断吗？`:`# ${books[currentBook].title}\n\n${$('book-text').innerText}`;download(text,`${books[currentBook].title}-${b.dataset.export}.md`);closePopovers()}
 if(b.dataset.action){closePopovers();if(b.dataset.action==='backup')download(JSON.stringify({goals,books},null,2),'aurareader-prototype-backup.json');else if(b.dataset.action==='restore')toast('设计稿：这里打开资料库恢复窗口');else toast(`${books[currentBook].title} · ${books[currentBook].author} · EPUB`)}
});
function download(text,name){const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出设计稿中的示例内容')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePopovers();document.body.classList.remove('focus-mode')}});
$('new-goal').onclick=newGoal;$('cancel-goal').onclick=()=>$('goal-dialog').close();
$('goal-form').onsubmit=e=>{e.preventDefault();const text=$('goal-input').value.trim();if(!text)return;const id='goal-'+Date.now();goals.push({id,text,children:[],book:'hugo',notes:0,area:'active'});selected=id;collection='active';renderGoals();$('goal-dialog').close();toast('Goal 已创建')};
$('collection-back').onclick=()=>{collection='active';renderGoals()};
$('reader-goal').onclick=()=>{collection='active';renderGoals();showScreen('goal')};
$('font-minus').onclick=()=>resizeFont(-1);$('font-plus').onclick=()=>resizeFont(1);
function resizeFont(delta){fontSize=Math.min(26,Math.max(14,fontSize+delta));$('font-size').textContent=fontSize+' px';$('book-text').style.fontSize=fontSize+'px'}
$('font-family').onchange=e=>$('book-text').style.fontFamily=e.target.value==='serif'?'Georgia,"Songti SC",SimSun,serif':'Inter,"Microsoft YaHei",sans-serif';
$('line-height').oninput=e=>$('book-text').style.lineHeight=e.target.value;
$('reading-width').oninput=e=>$('reading-content').style.maxWidth=e.target.value+'px';
$('focus-reader').onclick=()=>{const focus=document.body.classList.toggle('focus-mode');$('focus-reader').setAttribute('aria-label',focus?'退出专注阅读':'专注阅读');$('focus-reader').setAttribute('title',focus?'退出专注阅读 · Esc':'专注阅读')};
$('app-theme').onclick=()=>{const dark=document.body.classList.toggle('dark');$('app-theme').querySelector('span').textContent=dark?'深色':'浅色';closePopovers()};
$('previous-page').onclick=()=>setPage(page-1);$('next-page').onclick=()=>setPage(page+1);
$('link-note').onclick=()=>{$('link-note').innerHTML=icon('check')+'已加入当前 Goal';toast('笔记已关联到当前 Goal')};
renderGoals();renderBook();
})();
</script>
