<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Goal 区 · 三种标识方案</title>
  <style>
    :root { color-scheme: light; --paper:#f7f7f8; --selected:#f0f0f2; --ink:#25252d; --soft:#64646f; --edge:#e4e4e7; --quote:#d4d4db; }
    * { box-sizing:border-box; }
    body { margin:0; padding:36px 28px; color:var(--ink); background:#fff; font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif; }
    main { max-width:1120px; margin:auto; }
    h1 { margin:0 0 8px; font-size:22px; font-weight:600; }
    .intro,footer { margin:0; color:var(--soft); font-size:13px; line-height:1.8; }
    .comparisons { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:28px; margin-top:28px; }
    .proposal > header { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
    .number { font-size:11px; color:var(--soft); font-variant-numeric:tabular-nums; }
    .proposal h2 { margin:0; font-size:14px; font-weight:500; }
    .sidebar { min-height:620px; padding:12px 20px 24px; background:var(--paper); border-radius:12px; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
    .toolbar-group { display:flex; gap:4px; }
    .control { width:40px; height:40px; display:inline-flex; align-items:center; justify-content:center; flex:none; }
    .icon { width:20px; height:20px; fill:currentColor; display:block; flex:none; }
    .icon.small { width:16px; height:16px; }
    .parent { display:flex; align-items:center; gap:10px; min-height:48px; padding:10px; background:var(--selected); border-radius:8px; }
    .parent h3 { margin:0; font-size:16px; font-weight:500; line-height:1.7; overflow-wrap:anywhere; }
    .children { padding:0; margin:16px 0 0 16px; list-style:none; }
    .child { position:relative; display:flex; align-items:center; gap:8px; min-height:44px; padding:8px 10px; font-size:14px; line-height:1.8; }
    .child .icon { color:var(--soft); }
    .region-head { display:none; color:var(--soft); }
    .content { margin:16px 0 0 16px; border-top:1px solid var(--edge); padding-top:8px; }
    .content-tools { display:flex; align-items:center; justify-content:space-between; min-height:40px; margin-bottom:8px; padding-left:10px; }
    .content-type { visibility:hidden; color:var(--soft); }
    .item { display:grid; grid-template-columns:16px minmax(0,1fr); align-items:start; gap:8px; padding:4px 10px; margin-bottom:12px; font-size:13px; line-height:1.85; }
    .item > .icon { margin-top:5px; color:var(--soft); }
    .item p { margin:0; overflow-wrap:anywhere; }
    .item blockquote { margin:0; padding-left:10px; border-left:2px solid var(--quote); color:var(--soft); }
    .item .comment { margin-top:6px; padding-left:12px; }
    .caption { margin:12px 0 0; color:var(--soft); font-size:12px; line-height:1.8; }
    footer { margin-top:24px; }
    /* 01: branching lines connect only the Goal hierarchy. */
    .tree .children { margin-left:20px; border-left:1px solid var(--quote); padding-left:16px; }
    .tree .child::before { content:""; position:absolute; width:16px; left:-16px; top:22px; border-top:1px solid var(--quote); }
    .tree .child:last-child::after { content:""; position:absolute; left:-17px; top:23px; bottom:0; width:2px; background:var(--paper); }
    /* 02: one icon identifies each region, without per-child icon repetition. */
    .regions .parent { min-height:40px; padding:0 10px; }
    .regions .parent h3 { font-weight:500; line-height:1.85; }
    .regions .region-head { display:flex; height:28px; align-items:center; margin:12px 0 0 26px; }
    .regions .children { margin-top:0; }
    .regions .child > .icon { display:none; }
    .regions .content-type { visibility:visible; }
    /* 03: a bracket contains parent and children, ending before content. */
    .bracket .goal-family { position:relative; padding-left:16px; }
    .bracket .goal-family::before { content:""; position:absolute; left:0; top:10px; bottom:8px; width:7px; border:1px solid var(--quote); border-right:0; border-radius:3px 0 0 3px; }
    .bracket .children { margin-left:0; }
    .bracket .child { padding-left:10px; }
    .bracket .child > .icon { display:none; }
    @media(max-width:900px) {
      body { padding:24px 16px; }
      .comparisons { grid-template-columns:minmax(0,360px); justify-content:center; gap:28px; }
      .sidebar { min-height:0; }
    }
  </style>
</head>
<body>

  <main>
    <h1>Goal 区的三种标识方案</h1>
    <p class="intro">相同内容、相同配色，只比较图标与线条。面板内不使用模块标题文字。</p>
    <div class="comparisons" id="comparisons"></div>
    <footer>静态样稿，无新增、编辑或导航交互。示例文字仅用于比较，不代表已确认设计。</footer>
  </main>
  <script>
    const icon = (name, small = false) => `<svg class="icon${small ? ' small' : ''}" aria-hidden="true"><use href="#${name}"></use></svg>`;
    const control = (name, label) => `<span class="control" role="img" aria-label="${label}" title="${label}">${icon(name)}</span>`;
    const schemes = [
      { kind:'tree', number:'01', name:'树枝连线＋类型图标', caption:'连线只连接父子 Goal，到最后一个子 Goal 结束。' },
      { kind:'regions', number:'02', name:'区域图标＋分界线', caption:'用分支与文档叠层图标识别区域，减少重复图标。' },
      { kind:'bracket', number:'03', name:'左侧括线＋独立内容区', caption:'括线包围意图及其展开，内容保留在括线之外。' }
    ];
    document.querySelector('#comparisons').innerHTML = schemes.map(scheme => `
      <section class="proposal" aria-label="${scheme.name}">
        <header><span class="number">${scheme.number}</span><h2>${scheme.name}</h2></header>
        <div class="sidebar ${scheme.kind}">
          <div class="toolbar" aria-label="Goal navigation (static)">
            <div class="toolbar-group">${control('home','Goal root')}${control('up','Up one level')}</div>
            <div class="toolbar-group">${control('plus','New child goal')}${control('expand','Open full Goal workspace')}</div>
          </div>
          <div class="goal-family" role="group" aria-label="Goal and its sub-goals">
            <div class="parent">${scheme.kind === 'regions' ? '' : icon('goal')}<h3>企业家精神是什么？</h3></div>
            <div class="region-head" role="img" aria-label="Sub-goals" title="Sub-goals">${icon('branch')}</div>
            <ul class="children" aria-label="Sub-goals">
              <li class="child">${icon('goal',true)}<span>企业家与经营者有什么区别？</span></li>
              <li class="child">${icon('goal',true)}<span>创新一定是技术创新吗？</span></li>
            </ul>
          </div>
          <section class="content" aria-label="Content for this Goal">
            <div class="content-tools">
              <span class="content-type" role="img" aria-label="Goal content" title="Goal content">${icon('content')}</span>
              ${control('add-text','Add text')}
            </div>
            <article class="item" aria-label="User-authored text">
              ${icon('text',true)}<p>我更关注的是：企业家如何改变原有的价值创造方式。</p>
            </article>
            <article class="item" aria-label="Linked note">
              ${icon('note',true)}
              <div><blockquote>企业家精神表现为对变化的回应，以及对新机会的持续探索。</blockquote><p class="comment">这段话值得与前面的定义对照。</p></div>
            </article>
            <article class="item" aria-label="Linked highlight">
              ${icon('highlight',true)}<blockquote>创新也可以发生在组织方式和价值创造方式中。</blockquote>
            </article>
          </section>
        </div>
        <p class="caption">${scheme.caption}</p>
      </section>`).join('');
  </script>
</body>
</html>
