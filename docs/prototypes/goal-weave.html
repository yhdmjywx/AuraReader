<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>经纬织谱 · 同一段原文，两个 Goal</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fcf9f3;
      --ink: #292621;
      --teal: #16877f;
      --vermilion: #c45842;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Songti SC", "Noto Serif CJK SC", SimSun, serif;
    }
    main {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(18px, 5vw, 80px);
    }
    figure {
      margin: 0;
      width: min(100%, 1200px);
      display: grid;
      grid-template-columns: 22% 28% 1fr;
      grid-template-rows: auto minmax(90px, 18vh) auto minmax(90px, 18vh);
      align-items: center;
    }
    .goal {
      grid-row: 1;
      justify-self: center;
      margin: 0 0 16px;
      font-size: clamp(18px, 2.2vw, 32px);
      font-weight: 500;
    }
    .first { grid-column: 1; --thread: var(--teal); }
    .second { grid-column: 2; --thread: var(--vermilion); }
    .thread {
      grid-row: 2 / 5;
      place-self: stretch center;
      width: 2px;
      background: var(--thread);
    }
    .connection {
      grid-row: 3;
      grid-column: 1 / 3;
      /* The first thread sits at 11% of the figure, or 22% of this span. */
      margin-left: 22%;
      height: 1px;
      background: #716e65;
    }
    .knot {
      grid-row: 3;
      place-self: center;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--thread);
    }
    blockquote {
      grid-area: 3 / 3;
      position: relative;
      margin: 0;
      padding-left: clamp(12px, 2vw, 32px);
      font-size: clamp(23px, 3.2vw, 46px);
      line-height: 1.6;
      text-wrap: pretty;
    }
    .source {
      position: absolute;
      bottom: 100%;
      color: #706c63;
      font: 14px/1.8 system-ui, sans-serif;
      letter-spacing: .15em;
    }
    @media (max-width: 600px) {
      .goal { writing-mode: vertical-rl; letter-spacing: .12em; align-self: end; }
      figure { grid-template-rows: auto 65px auto 70px; }
      blockquote { font-size: 21px; }
    }
  </style>
</head>
<body>
  <main>
    <figure aria-label="同一段原文关联到两个阅读目标">
      <p class="goal first">留意他的谎言</p>
      <p class="goal second">留意父子间的沉默</p>
      <span class="thread first" aria-hidden="true"></span>
      <span class="thread second" aria-hidden="true"></span>
      <span class="connection" aria-hidden="true"></span>
      <span class="knot first" aria-hidden="true"></span>
      <span class="knot second" aria-hidden="true"></span>
      <blockquote><span class="source">原文</span>“我没事。”他说。<br>父亲没有再问。</blockquote>
    </figure>
  </main>
</body>
</html>
