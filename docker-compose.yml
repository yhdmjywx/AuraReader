version: '3.8'

services:
  aurareader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurareader-workstation
    restart: unless-stopped
    ports:
      - "8095:80"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
