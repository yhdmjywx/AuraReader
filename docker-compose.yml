version: '3.8'

services:
  aurareader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurareader-workstation
    restart: unless-stopped
    ports:
      - "8095:80"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
